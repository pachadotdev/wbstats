# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday 03:00 UTC
  workflow_dispatch:

name: data-coverage

jobs:
  data-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install package
        run: |
          options(warn = 2)
          pak::local_install(".", dependencies = TRUE)
        shell: Rscript {0}

      - name: Data coverage
        run: source("dev/data-coverage.R")
        shell: Rscript {0}

      - name: Commit data coverage
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Move the freshly generated JSON files out of the way before switching branches
          mv data-coverage-output /tmp/data-coverage-output

          # Reset (or create) the data-coverage branch so it holds only the JSON files,
          # without dragging along the full source history each run
          git checkout -B data-coverage

          # Drop everything else, keep just the new JSON files
          git rm -rf . > /dev/null 2>&1 || true
          mv /tmp/data-coverage-output/* .
          rmdir /tmp/data-coverage-output

          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Update data coverage files"
            git push --force origin data-coverage
          else
            echo "No changes to commit"
          fi

