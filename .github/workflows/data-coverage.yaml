# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help

# on:
#   schedule:
#     - cron: "0 3 1 * 0" # Monthly, 1st day of the month at 03:00 UTC
#   workflow_dispatch:

on:
  workflow_dispatch:

name: data-coverage

# Every indicator is downloaded and summarized individually (there's no bulk
# coverage endpoint), so a single-job, single-commit run can take longer than
# GitHub Actions' 6h job limit. Instead:
#   1. `prepare` makes sure the `data-coverage` branch exists (creating it
#      empty if this is the very first run) and splits all indicators into
#      at most WB_MAX_SHARDS shards for the matrix below (GitHub Actions
#      caps a matrix at 256 configurations).
#   2. `data-coverage` runs one job per shard in parallel. Each shard commits
#      its results in batches of 10 indicators (see dev/data-coverage.R),
#      skipping any file whose content hasn't changed since it was last
#      committed, and pushes to its OWN branch (data-coverage-shard-<range>)
#      so parallel shards never contend over the same ref.
#   3. `merge-shards` runs once all shards are done and sequentially merges
#      every shard branch into `data-coverage`, then deletes the shard
#      branches. Being sequential, this step never has push conflicts either.
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      WB_MAX_SHARDS: 50

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install package
        run: |
          options(warn = 2)
          pak::local_install(".", dependencies = TRUE)
        shell: Rscript {0}

      - name: Ensure data-coverage branch exists
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          default_branch="$(git rev-parse --abbrev-ref HEAD)"

          if git ls-remote --exit-code --heads origin data-coverage > /dev/null 2>&1; then
            echo "data-coverage branch already exists"
          else
            echo "creating empty data-coverage branch"
            git checkout --orphan data-coverage
            git rm -rf . > /dev/null 2>&1 || true
            git commit --allow-empty -m "Initialize empty data-coverage branch"
            git push origin data-coverage

            # git rm -rf wiped the working directory (this is the orphan
            # branch's whole point), so switch back to the source branch
            # before later steps need the package/scripts on disk again
            git checkout "$default_branch"
          fi

      - name: Build indicator list and shard matrix
        id: matrix
        run: source("dev/build-indicator-shards.R")
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        with:
          name: indicators
          path: dev/indicators.rds

  data-coverage:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      WB_SHARD_START: ${{ matrix.shard.start }}
      WB_SHARD_END: ${{ matrix.shard.end }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: false

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install package
        run: |
          options(warn = 2)
          pak::local_install(".", dependencies = TRUE)
        shell: Rscript {0}

      - uses: actions/download-artifact@v4
        with:
          name: indicators
          path: dev

      - name: "Data coverage (indicators ${{ matrix.shard.start }}-${{ matrix.shard.end }})"
        run: source("dev/data-coverage.R")
        shell: Rscript {0}

  merge-shards:
    needs: [prepare, data-coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: data-coverage
          fetch-depth: 0

      - name: Merge shard branches into data-coverage
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          echo "$MATRIX_JSON" | jq -c '.[]' | while read -r shard; do
            start=$(echo "$shard" | jq -r '.start')
            end=$(echo "$shard" | jq -r '.end')
            branch="data-coverage-shard-${start}-${end}"

            if git ls-remote --exit-code --heads origin "$branch" > /dev/null 2>&1; then
              echo "merging $branch"
              git fetch origin "$branch"
              git merge --no-ff -m "Merge $branch" "origin/$branch"
              git push origin data-coverage
              git push origin --delete "$branch"
            else
              echo "shard branch $branch not found, skipping"
            fi
          done
